<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LUMEN · Portafolio</title>
  <style>
    :root{
      --bg:#05030f;
      --violet:#8b5cf6;
      --violet-soft:#c4b5fd;
      --cyan:#22d3ee;
      --rose:#fb7185;
      --text:#eef2ff;
      --muted:#8b93b8;
      --glass:rgba(18,16,40,.65);
      --border:rgba(139,92,246,.3);
      --radius:16px;
      --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
      --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
      --flame-hue:0deg;
    }

    @property --radius {
      syntax: '<length>';
      inherits: false;
      initial-value: 170px;
    }

    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;overflow:hidden;
      background:var(--bg);
      color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;
    }
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

    /* FONDO */
    .bg-aurora{
      position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
      background:
        radial-gradient(circle at 20% 25%, rgba(139,92,246,.18), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(34,211,238,.12), transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(251,113,133,.08), transparent 50%),
        var(--bg);
    }
    .bg-aurora::before,.bg-aurora::after{
      content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;
      filter:blur(90px);opacity:.22;
    }
    .bg-aurora::before{
      background:radial-gradient(circle,#8b5cf6,transparent 65%);
      top:-30%;left:-15%;animation:drift 24s ease-in-out infinite alternate;
    }
    .bg-aurora::after{
      background:radial-gradient(circle,#22d3ee,transparent 65%);
      bottom:-35%;right:-15%;animation:drift 28s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift{
      from{transform:translate(0,0) scale(1)}
      to{transform:translate(8vw,6vh) scale(1.2)}
    }

    .stars{
      position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
      background-image:
        radial-gradient(1px 1px at 20% 30%, #fff, transparent),
        radial-gradient(1px 1px at 70% 15%, #c4b5fd, transparent),
        radial-gradient(1.5px 1.5px at 40% 70%, #22d3ee, transparent),
        radial-gradient(1px 1px at 85% 60%, #fff, transparent),
        radial-gradient(1px 1px at 55% 45%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 15% 85%, #fb7185, transparent),
        radial-gradient(1px 1px at 90% 90%, #c4b5fd, transparent);
      background-size:300px 300px;
      background-repeat:repeat;
      animation:twinkle 6s ease-in-out infinite alternate;
    }
    @keyframes twinkle{from{opacity:.3}to{opacity:.7}}

    .scene{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
    .particles{position:absolute;inset:0}
    .particle--emoji{position:absolute;bottom:38%;width:auto;height:auto;font-size:1.4rem;animation:floatUp 4s ease-out forwards;filter:drop-shadow(0 0 12px rgba(34,211,238,.6))}
    @keyframes floatUp{
      0%{opacity:0;transform:translateY(0) scale(.6)}
      20%{opacity:1}
      100%{opacity:0;transform:translateY(-220px) scale(1.15) rotate(12deg)}
    }

    /* TOPBAR */
    .topbar{position:fixed;top:18px;right:18px;z-index:25;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn{
      font:600 .74rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
      color:var(--violet-soft);text-decoration:none;cursor:pointer;
      padding:11px 16px;border-radius:10px;
      background:var(--glass);border:1px solid rgba(139,92,246,.35);
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      box-shadow:0 0 20px rgba(139,92,246,.15);transition:all .2s;
    }
    .btn:hover{transform:translateY(-1px);background:rgba(139,92,246,.15);color:#fff;box-shadow:0 0 28px rgba(139,92,246,.4)}

    /* ESCENARIO */
    .stage{
      position:fixed;left:50%;top:45%;
      transform:translate(-50%,-50%);
      z-index:10;pointer-events:none;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    }

    .lamp{
      position:relative;width:300px;height:350px;
      display:grid;place-items:center;
      perspective:1200px;
    }

    /* Asteroides */
    .asteroid-field{position:absolute;inset:0;pointer-events:none;z-index:20}
    .asteroid-wrapper{
      position:absolute;top:50%;left:50%;
      width:75px;height:75px;margin:-37.5px 0 0 -37.5px;
      pointer-events:auto;cursor:pointer;will-change:transform;
    }
    .ast-1{--radius:170px;animation:orbit 22s linear infinite;           transition:--radius .35s cubic-bezier(.2,.9,.3,1.1)}
    .ast-2{--radius:180px;animation:orbit 28s linear infinite reverse;   animation-delay:-7s;  transition:--radius .35s cubic-bezier(.2,.9,.3,1.1)}
    .ast-3{--radius:160px;animation:orbit 26s linear infinite;           animation-delay:-12s; transition:--radius .35s cubic-bezier(.2,.9,.3,1.1)}
    .ast-4{--radius:175px;animation:orbit 20s linear infinite reverse;   animation-delay:-5s;  transition:--radius .35s cubic-bezier(.2,.9,.3,1.1)}
    .asteroid-wrapper:hover{--radius:125px}

    @keyframes orbit{
      from{transform:rotate(0deg) translateX(var(--radius)) rotate(0deg)}
      to  {transform:rotate(360deg) translateX(var(--radius)) rotate(-360deg)}
    }

    .asteroid-body{width:100%;height:100%;animation:floatAst 4s ease-in-out infinite alternate}
    .ast-1 .asteroid-body{animation-duration:3s}
    .ast-2 .asteroid-body{animation-duration:3.5s;animation-delay:-.5s}
    .ast-3 .asteroid-body{animation-duration:4s;animation-delay:-1s}
    .ast-4 .asteroid-body{animation-duration:2.8s;animation-delay:-1.5s}

    @keyframes floatAst{0%{transform:translateY(0)}100%{transform:translateY(-15px)}}

    .asteroid{
      width:100%;height:100%;
      background:radial-gradient(circle at 35% 30%, #2e2352, #0e0a1f);
      border-radius:45% 55% 70% 30% / 40% 50% 60% 50%;
      box-shadow:
        inset -6px -6px 12px rgba(0,0,0,0.8),
        inset 4px 4px 12px rgba(139,92,246,0.3),
        0 0 25px rgba(34,211,238,0.4);
      border:1px solid rgba(34,211,238,0.5);
      animation:spinAst 20s linear infinite;
      transition:box-shadow .3s, border-color .3s, scale .3s cubic-bezier(.2,.9,.3,1.1);
    }
    .ast-1 .asteroid{animation-duration:25s}
    .ast-2 .asteroid{animation-duration:22s;animation-direction:reverse}
    .ast-3 .asteroid{animation-duration:28s}
    .ast-4 .asteroid{animation-duration:20s;animation-direction:reverse}

    @keyframes spinAst{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

    .asteroid::before,.asteroid::after{
      content:"";position:absolute;background:rgba(0,0,0,0.6);
      border-radius:50%;box-shadow:inset 2px 2px 4px rgba(0,0,0,0.8),0 0 6px rgba(139,92,246,0.5);
    }
    .asteroid::before{width:22px;height:22px;top:15%;left:20%}
    .asteroid::after{width:12px;height:12px;bottom:25%;right:20%}

    .asteroid-wrapper:hover .asteroid{
      scale:1.15;
      box-shadow:
        inset -6px -6px 12px rgba(0,0,0,0.8),
        inset 4px 4px 12px rgba(139,92,246,0.5),
        0 0 35px rgba(34,211,238,0.8);
      border-color:var(--cyan);
    }
    .asteroid-wrapper:hover{z-index:30}

    .asteroid__tip{
      position:absolute;bottom:110%;left:50%;
      transform:translateX(-50%);
      background:rgba(18,16,40,.85);border:1px solid var(--cyan);
      color:var(--cyan);padding:5px 10px;border-radius:8px;
      font:600 .65rem/1.2 var(--mono);white-space:nowrap;text-transform:uppercase;
      pointer-events:none;letter-spacing:0.05em;
      box-shadow:0 0 12px rgba(34,211,238,.25);
      transition: all 0.3s ease;
    }
    .asteroid__tip::after{
      content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
      border-width:5px;border-style:solid;border-color:var(--cyan) transparent transparent transparent;
    }
    .asteroid-wrapper:hover .asteroid__tip{
      color:#fff;
      box-shadow:0 0 20px rgba(34,211,238,.6);
    }

    /* LINTERNA MEDIEVAL 3D */
    .lantern-container{
      position:relative;width:150px;height:240px;
      animation:lanternSpin 20s linear infinite;
      will-change:transform;
      transform-style:preserve-3d;
    }
    @keyframes lanternSpin{
      from{transform:rotateY(0deg)}
      to  {transform:rotateY(360deg)}
    }
    .lamp.speaking .lantern-container{animation-duration:3s}
    .lamp.speaking .asteroid-wrapper{animation-duration:8s}

    .lantern-halo{
      position:absolute;inset:-50px;
      background:radial-gradient(circle, rgba(139,92,246,.4) 0%, rgba(34,211,238,.15) 50%, transparent 70%);
      filter:blur(20px);
      animation:breathe 5s ease-in-out infinite;
      pointer-events:none;border-radius:50%;
      transition:background .4s ease;
    }
    @keyframes breathe{
      0%,100%{opacity:.7;transform:scale(1)}
      50%{opacity:1;transform:scale(1.1)}
    }
    .lamp.speaking .lantern-halo{
      background:radial-gradient(circle,
        rgba(139,92,246,.45) 0%,
        rgba(251,113,133,.22) 45%,
        transparent 70%);
      animation-duration:1.2s;opacity:1;
    }

    .lantern-3d{
      position:absolute;left:50%;bottom:0;
      width:100px;height:227px;margin-left:-50px;
      transform-style:preserve-3d;
    }
    .handle-3d{
      position:absolute;bottom:187px;left:50%;
      width:50px;height:40px;margin-left:-25px;
      transform-style:preserve-3d;
    }
    .handle-plane{
      position:absolute;inset:0;
      border:3px solid #2a2044;
      border-bottom:none;
      border-radius:25px 25px 0 0;
      box-shadow:0 0 12px rgba(139,92,246,.4), inset 0 0 8px rgba(34,211,238,.2);
      backface-visibility:visible;
    }
    .handle-plane--rot{transform:rotateY(90deg)}

    .roof-3d{
      position:absolute;bottom:142px;left:50%;
      width:100px;height:45px;margin-left:-50px;
      transform-style:preserve-3d;
    }
    .roof-face{
      position:absolute;bottom:0;left:0;
      width:100px;height:67.3px;
      background:linear-gradient(135deg, #4a3780 0%, #2e2352 40%, #0e0a1f 100%);
      clip-path:polygon(50% 0%, 100% 100%, 0% 100%);
      transform-origin:50% 100%;
      backface-visibility:visible;
    }
    .roof-face--front{transform:translateZ(50px) rotateX(48deg)}
    .roof-face--back {transform:rotateY(180deg) translateZ(50px) rotateX(48deg)}
    .roof-face--left {transform:rotateY(-90deg) translateZ(50px) rotateX(48deg)}
    .roof-face--right{transform:rotateY(90deg)  translateZ(50px) rotateX(48deg)}

    .body-3d{
      position:absolute;bottom:12px;left:50%;
      width:100px;height:130px;margin-left:-50px;
      transform-style:preserve-3d;
    }
    .body-face{
      position:absolute;inset:0;
      background:linear-gradient(to bottom, rgba(139,92,246,.06), rgba(34,211,238,.03));
      border:2px solid rgba(139,92,246,.7);
      box-shadow:inset 0 0 20px rgba(34,211,238,.15);
      backface-visibility:visible;
    }
    .body-face--front{transform:translateZ(50px)}
    .body-face--back {transform:rotateY(180deg) translateZ(50px)}
    .body-face--left {transform:rotateY(-90deg) translateZ(50px)}
    .body-face--right{transform:rotateY(90deg)  translateZ(50px)}

    .lamp.speaking .body-face{
      box-shadow:inset 0 0 40px rgba(34,211,238,.5), 0 0 20px rgba(139,92,246,.6);
      border-color:var(--cyan);
    }

    .fire-3d{
      position:absolute;left:50%;bottom:10px;
      width:60px;height:80px;margin-left:-30px;
      transform-style:preserve-3d;
      pointer-events:none;
      transition:transform .3s ease;
    }
    .fire-plane{
      position:absolute;inset:0;
      filter:hue-rotate(var(--flame-hue)) drop-shadow(0 0 15px rgba(34,211,238,.8));
      transition:filter .6s ease;
    }
    .fire-plane--lr{transform:rotateY(90deg)}

    .fire{
      position:absolute;bottom:0;left:50%;
      transform-origin:50% 100%;
      border-radius:50% 50% 45% 45% / 65% 65% 35% 35%;
      mix-blend-mode:screen;
    }
    .f1{
      width:60px;height:80px;margin-left:-30px;
      background:radial-gradient(ellipse at 50% 80%, rgba(139,92,246,.8), transparent 70%);
      animation:flick 2.6s ease-in-out infinite;
    }
    .f2{
      width:40px;height:60px;margin-left:-20px;
      background:radial-gradient(ellipse at 50% 80%, var(--cyan), transparent 70%);
      animation:flick 1.7s ease-in-out infinite reverse;
    }
    .f3{
      width:20px;height:35px;margin-left:-10px;
      background:radial-gradient(ellipse at 50% 80%, #fff, var(--rose) 60%, transparent 80%);
      animation:flick 1.1s ease-in-out infinite;
    }
    @keyframes flick{
      0%,100%{transform:scale(1) rotate(-2deg)}
      25%{transform:scale(1.06,.94) rotate(2deg)}
      50%{transform:scale(.95,1.08) rotate(-1deg)}
      75%{transform:scale(1.04,.97) rotate(3deg)}
    }

    .lamp.speaking .fire-3d{transform:scale(1.15)}
    .lamp.speaking .f1{animation-duration:.7s}
    .lamp.speaking .f2{animation-duration:.5s}
    .lamp.speaking .f3{animation-duration:.35s}

    .lamp.speaking-pulse .fire-plane{
      filter:hue-rotate(var(--flame-hue)) brightness(1.4) drop-shadow(0 0 25px rgba(34,211,238,1));
      transition:filter .1s ease-out;
    }

    .base-3d{
      position:absolute;bottom:-53px;left:50%;
      width:130px;height:130px;margin-left:-65px;
      background:linear-gradient(160deg, #3a2d5a 0%, #0e0a1f 100%);
      border:2px solid var(--cyan);
      border-radius:10px;
      box-shadow:0 0 25px rgba(34,211,238,.4), inset 0 0 20px rgba(0,0,0,.7);
      transform:rotateX(90deg);
      backface-visibility:visible;
    }

    .status{
      margin:0;font:600 .72rem/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;
      color:var(--cyan);text-shadow:0 0 16px rgba(34,211,238,.6);
    }
    .status span{color:#fff}

    /* CHISPAS */
    .spark{
      position:fixed;width:6px;height:6px;border-radius:50%;
      pointer-events:none;z-index:100;color:#fff;
      box-shadow:0 0 10px currentColor, 0 0 18px currentColor;
      animation:sparkFly .9s cubic-bezier(.15,.7,.3,1) forwards;
    }
    @keyframes sparkFly{
      0%{transform:translate(-50%,-50%) scale(1);opacity:1}
      60%{opacity:.9}
      100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0);opacity:0}
    }

    /* CHAT */
    .chat{
      position:fixed;left:50%;bottom:30px;
      transform:translateX(-50%);
      z-index:30;width:min(600px, 90vw);
      pointer-events:none;
    }
    .chat > *{pointer-events:auto}

    .chat__form{
      display:flex;gap:10px;align-items:center;
      padding:6px 6px 6px 18px;border-radius:999px;
      background:rgba(18,16,40,.8);
      border:1px solid rgba(139,92,246,.35);
      box-shadow:0 0 24px rgba(139,92,246,.15);
      -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
      transition:all .3s;
    }
    .chat__form:focus-within{border-color:var(--cyan);box-shadow:0 0 34px rgba(34,211,238,.3)}
    .chat__input{
      flex:1;min-width:0;padding:10px 6px;background:transparent;border:0;outline:none;
      color:var(--text);font:500 .95rem/1.2 var(--font);
    }
    .chat__input::placeholder{color:var(--muted);opacity:.6}
    .chat__send{
      cursor:pointer;padding:12px 20px;border-radius:999px;
      border:1px solid rgba(34,211,238,.5);
      background:linear-gradient(180deg, rgba(139,92,246,.3), rgba(34,211,238,.15));
      color:var(--text);font:700 .76rem/1 var(--mono);letter-spacing:.14em;
      transition:.2s;
    }
    .chat__send:hover{
      box-shadow:0 0 26px rgba(34,211,238,.5);
      background:linear-gradient(180deg, rgba(139,92,246,.5), rgba(34,211,238,.3));
    }
    .voice-toggle{
      cursor:pointer;flex:none;width:40px;height:40px;display:grid;place-items:center;
      border-radius:50%;border:1px solid rgba(251,113,133,.4);
      background:transparent;color:var(--rose);font-size:1rem;line-height:1;transition:.2s;
    }
    .voice-toggle:hover{border-color:var(--rose);box-shadow:0 0 16px rgba(251,113,133,.4);color:#fff}
    .voice-toggle[aria-pressed="true"]{
      color:var(--rose);border-color:var(--rose);
      background:rgba(251,113,133,.12);
      box-shadow:0 0 20px rgba(251,113,133,.35);
    }

    /* PANEL DE PROYECTOS */
    .proj{
      position:fixed;left:18px;top:50%;transform:translateY(-50%) translateX(-12px);
      z-index:28;width:290px;max-height:70vh;overflow:auto;padding:14px;border-radius:14px;
      background:rgba(18,16,40,.88);border:1px solid var(--border);
      -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
      box-shadow:0 0 30px rgba(139,92,246,.25);
      opacity:0;pointer-events:none;transition:opacity .3s, transform .3s;
    }
    .proj.show{opacity:1;pointer-events:auto;transform:translateY(-50%)}
    .proj h3{margin:0 0 10px;font:700 .7rem/1 var(--mono);letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}
    .proj a{display:block;text-decoration:none;color:var(--text);padding:9px 10px;margin-bottom:8px;border-radius:10px;border:1px solid rgba(139,92,246,.25);transition:.2s}
    .proj a:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(34,211,238,.3)}
    .proj b{display:block;font:600 .82rem/1.2 var(--font)}
    .proj small{display:block;margin-top:3px;color:var(--muted);font:400 .72rem/1.3 var(--font)}
    .proj em{display:block;margin-top:4px;color:var(--violet-soft);font:500 .65rem/1.2 var(--mono);font-style:normal}

    /* RESPONSIVE */
    @media (max-width:1024px){
      .asteroid-field{display:none}
      .stage{left:50%;top:40%;transform:translate(-50%,-50%)}
      .lamp{transform:scale(.82)}
      .chat{bottom:20px;width:95vw}
      .topbar{top:64px;right:10px;left:10px;justify-content:center}
      .btn{padding:9px 12px;font-size:.64rem}
      .proj{left:50%;top:auto;bottom:84px;width:min(92vw,420px);max-height:38vh;transform:translateX(-50%) translateY(12px)}
      .proj.show{transform:translateX(-50%)}
    }

    /* REDUCED MOTION */
    @media (prefers-reduced-motion: reduce){
      .lantern-container,
      .lamp.speaking .lantern-container,
      .asteroid-wrapper,
      .asteroid-body,
      .asteroid{animation:none !important}
      .asteroid-wrapper{transition:none !important}

      .ast-1{top:30px;left:-10px;right:auto;bottom:auto;margin:0}
      .ast-2{top:40px;right:-10px;left:auto;bottom:auto;margin:0}
      .ast-3{bottom:50px;top:auto;left:-15px;right:auto;margin:0}
      .ast-4{bottom:40px;top:auto;right:-15px;left:auto;margin:0}

      .spark{display:none !important}
    }
  </style>
</head>
<body>

  <div class="bg-aurora"></div>
  <div class="stars"></div>
  <div class="scene" aria-hidden="true"><div class="particles" id="particles"></div></div>

  <header class="topbar">
    <!-- CV incrustado en el propio archivo: la descarga funciona sin Drive ni archivos externos -->
    <a class="btn" id="cvBtn" href="#" download="CV_John_Esteban_Sepulveda.pdf" title="Descargar CV en PDF">⤓ DESCARGAR CV</a>
  </header>

  <main class="stage">
    <div class="lamp" id="lamp">

      <div class="asteroid-field">
        <div class="asteroid-wrapper ast-1" data-question="¿Cuál es tu experiencia?">
          <div class="asteroid-body"><div class="asteroid"></div></div>
          <span class="asteroid__tip">Experiencia</span>
        </div>
        <div class="asteroid-wrapper ast-2" data-question="¿Qué proyectos has hecho?">
          <div class="asteroid-body"><div class="asteroid"></div></div>
          <span class="asteroid__tip">Proyectos</span>
        </div>
        <div class="asteroid-wrapper ast-3" data-question="¿Qué tecnologías dominas?">
          <div class="asteroid-body"><div class="asteroid"></div></div>
          <span class="asteroid__tip">Tecnologías</span>
        </div>
        <div class="asteroid-wrapper ast-4" data-question="¿Cómo te contacto?">
          <div class="asteroid-body"><div class="asteroid"></div></div>
          <span class="asteroid__tip">Contacto</span>
        </div>
      </div>

      <div class="lantern-container" aria-hidden="true">
        <div class="lantern-halo"></div>

        <div class="lantern-3d">
          <div class="handle-3d">
            <div class="handle-plane"></div>
            <div class="handle-plane handle-plane--rot"></div>
          </div>

          <div class="roof-3d">
            <div class="roof-face roof-face--front"></div>
            <div class="roof-face roof-face--back"></div>
            <div class="roof-face roof-face--left"></div>
            <div class="roof-face roof-face--right"></div>
          </div>

          <div class="body-3d">
            <div class="body-face body-face--back"></div>
            <div class="body-face body-face--left"></div>
            <div class="body-face body-face--right"></div>

            <div class="fire-3d">
              <div class="fire-plane fire-plane--fb">
                <div class="fire f1"></div>
                <div class="fire f2"></div>
                <div class="fire f3"></div>
              </div>

    function downloadCV() {
      try {
        const bin = atob(CV_PDF_BASE64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: 'application/pdf' });

        // Compatibilidad con navegadores antiguos (Edge/IE)
        if (window.navigator && window.navigator.msSaveOrOpenBlob) {
          window.navigator.msSaveOrOpenBlob(blob, CV_FILENAME);
          return true;
        }

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = CV_FILENAME;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);

        return false;

      function createVoice() {
        const supported = 'speechSynthesis' in window;
        let enabled = false, voice = null, queue = [], speaking = false;
        let onBoundaryFn = null, onEndFn = null;

        function pickVoice() {
          const voices = speechSynthesis.getVoices();
          const es = voices.filter(v => /^es/i.test(v.lang));
          const MALE = /(jorge|diego|carlos|miguel|enrique|pablo|juan|pedro|andres|andrés|javier|fernando|ricardo|felipe|sebastian|sebastián|gonzalo|rafael|alfonso|armando|esteban|mateo|mario|antonio|manuel|alberto|jose|josé|rodrigo|santiago|nico|hernan|hernán|mauricio|dario|darío|ivan|iván|oscar|óscar|raul|raúl|hector|héctor|samuel|victor|víctor|tomas|tomás|gerardo|arturo|emilio|rogelio)/i;
          const male = es.find(v => MALE.test(v.name));
          if (male) return male;
          const prefer = [/^es[-_]CO/i, /^es[-_]MX/i, /^es[-_]ES/i];
          for (const re of prefer) { const v = es.find(v => re.test(v.lang)); if (v) return v; }
          return es[0] || voices[0] || null;
        }

        if (supported) { voice = pickVoice(); speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); }; }

        function cancel() {
          if (supported) {
            queue = [];
            speaking = false;
            try { speechSynthesis.cancel(); } catch {}
            onEndFn?.();
          }
        }

        function playNext() {
          if (!enabled || speaking) return;
          const text = queue.shift(); if (!text) return;
          speaking = true;
          const u = new SpeechSynthesisUtterance(text);
          u.lang = voice?.lang || 'es-CO'; if (voice) u.voice = voice;
          u.rate = 0.85; u.pitch = 0.35; u.volume = 1.0;

          u.onboundary = (e) => onBoundaryFn?.(e);
          u.onend = () => {
            speaking = false;
            if (queue.length > 0) playNext(); else onEndFn?.();
          };
          u.onerror = () => { speaking = false; onEndFn?.(); };
          try { speechSynthesis.speak(u); } catch { speaking = false; onEndFn?.(); }
        }

        return {
          supported, isEnabled: () => enabled,
          setEnabled: (on) => { enabled = !!on; if (!enabled) cancel(); },
          enqueue: (text) => {
            if (!supported || !enabled) return;
            const eerie = text.replace(/([.,])\s+/g, '$1 … ');
            queue.push(eerie);
            playNext();

          cancel, onBoundary: (fn) => { onBoundaryFn = fn; },
          onEnd: (fn) => { onEndFn = fn; }
        };
